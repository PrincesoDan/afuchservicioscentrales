# Producción en el VPS. Uso y operación: docs/operacion/runbook.md
#
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-datos:/var/lib/postgresql/data
    # Sin puertos publicados: solo la red interna de compose llega a la base.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_DIR: /data
    volumes:
      - documentos:/data
    depends_on:
      postgres:
        condition: service_healthy

  # Migraciones y CLI: docker compose ... run --rm herramientas pnpm cli ayuda
  herramientas:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: herramientas
    profiles: ['herramientas']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_DIR: /data
    working_dir: /repo/apps/web
    volumes:
      - documentos:/data
      - ./entrada:/entrada:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  pg-datos:
  documentos:
  caddy-datos:
  caddy-config:
