name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afuch
          POSTGRES_PASSWORD: afuch
          POSTGRES_DB: afuch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afuch" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://afuch:afuch@localhost:5432/afuch_test
      DATABASE_URL_E2E: postgresql://afuch:afuch@localhost:5432/afuch_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @afuch/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
